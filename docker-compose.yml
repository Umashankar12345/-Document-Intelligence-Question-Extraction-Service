services:
  db:
    image: postgres:16-alpine
    container_name: pragati_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pragati
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pragati_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: pragati_api
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pragati
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ROOT=/app/data/storage
      - JWT_SECRET=${JWT_SECRET:-docker-dev-secret-please-change-in-production-32bytes}
    ports:
      - "8000:8000"
    volumes:
      - shared_storage:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    container_name: pragati_worker
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pragati
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ROOT=/app/data/storage
      - JWT_SECRET=${JWT_SECRET:-docker-dev-secret-please-change-in-production-32bytes}
    volumes:
      - shared_storage:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker -l info -c 4

volumes:
  pgdata:
  redisdata:
  shared_storage:
